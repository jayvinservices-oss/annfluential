# Annie ASMR pipeline settings. Secrets go in .env, never here.

channel:
  name: Annie ASMR
  handle: "@annieasmr9051"
  goal_watch_hours: 4000
  goal_subscribers: 1000
  target_date: 2027-01-17          # aim
  hard_cutoff: "2027-01-31 18:59"  # Toronto time
  timezone: America/Toronto
  # Starting point from the brief (3 Nov 2026), used until the first report runs
  baseline: {date: 2026-11-03, subscribers: 1034, watch_hours: 543}

video:
  width: 1920
  height: 1080
  fps: 30
  crf: 18
  preset: medium          # "slow" looks a little better, takes much longer on an Intel Mac
  crossfade_seconds: 1.5  # between clips inside a segment
  segment_crossfade_seconds: 2.0  # between chapters
  loop_variants: 3        # different clip orders per segment, so loops do not repeat identically

audio:
  sample_rate: 48000
  # YouTube turns loud videos down to about -14 LUFS but never turns quiet ones up.
  # Whisper ASMR usually sits quieter; -18 keeps it gentle without being too faint on phones.
  target_lufs: -18
  true_peak: -1.5
  lra: 11
  bed_gain_db: -4      # sound bed (gum, gloss, paper ...)
  voice_gain_db: 0     # whispers and talking

opening:
  # Viewers decide in the first 5 seconds. The first shot of the first chapter opens the video
  # and is used for the thumbnail, so put the strongest trigger from the title there.
  quiet_seconds: 30    # no talking before this; checks warn if a voice line starts earlier
  thumbnail_at: 3      # seconds into the opening shot for the default thumbnail frame

generator:
  provider: manual     # runway | replicate | manual   (you choose; manual = web UI, drop files in)
  clip_seconds: 10
  takes_per_shot: 2    # generate 2 takes, keep the best, delete the rest
  reference_image: prompts/reference/avatar.png   # export of Canva MAHZ22R5eUg (concept 2)
  runway:
    endpoint: https://api.dev.runwayml.com/v1
    api_version: "2024-11-06"
    model: gen4_turbo
    ratio: "1280:720"
  replicate:
    model: "owner/model-name"      # e.g. a Kling, Wan, Hailuo or Veo model on Replicate
    prompt_field: prompt
    image_field: start_image       # check the model page; often "image" or "start_image"
    negative_field: negative_prompt
    duration_field: duration
    extra_input: {}                # any other model inputs, e.g. {aspect_ratio: "16:9"}

voice:
  provider: manual     # elevenlabs | voicestudio | local | manual
  elevenlabs:
    model_id: eleven_v3
    whisper_tag: "[whispers]"     # v3 audio tag; leave "" for other models
    output_format: mp3_44100_128
    stability: 0.5
    similarity_boost: 0.85
    style: 0.0
  voicestudio:
    # Backend runs on another machine (not the Intel Mac). URL, key and profile id go in .env.
    num_step: 32          # 32 = cleaner (audiobook default); 16 = faster
    speed: 0.95           # a touch slower for whispers
    effect_preset: broadcast
    seed: null            # set a number once a take sounds right, to keep the voice consistent
    engine: null          # null = backend default (OmniVoice)
  local:
    # Command that turns text into a file with your cloned voice (e.g. VoiceStudio's CLI if it has one).
    # {text_file} and {out} are filled in. Leave empty if VoiceStudio is app-only: use manual instead.
    command: ""

youtube:
  category_id: "26"    # Howto & Style
  default_language: en
  base_tags: [asmr, asmr beauty, asmr no talking, tingles, relaxing asmr, asmr for sleep]
  disclosure: >-
    About this video: the hands and lower-face presenter are AI-generated, and the voice
    is a digital clone of my own voice. Sounds are real recordings or curated sound effects.
    Marked as altered or synthetic content on YouTube.
