# Ace, Ann's real cat. His real face and look must be kept in every image/video prompt.
# Written 5 Nov 2026 from 14 of Ann's photos (Drive: Annie ASMR > Ace, folder 1rdHJ0WTq9pB3619Hn4tjOxJLWa1Ei2zw).
# Start clips from his real photos (prompts/reference/ace/, git-ignored) or his real videos; use this text
# alongside, never instead of, a reference image.
# Note: one photo (IMG_0096) also shows a second cat, a solid grey short-haired cat. That is NOT Ace.

version: 1

description: >-
  Ace, an adult black-and-white tuxedo cat with a short, dense, glossy coat. Solid jet-black head, ears, back,
  sides, legs and tail. Bright white muzzle and chin area with a thin white blaze that runs up the bridge of his
  nose to between the eyes. Small pink nose. A small black spot/line along the lower lip and chin under the
  white muzzle. A broad white bib that runs from the throat down the chest. White front paws (short white
  socks/mittens) and white back feet, pink toe beans. Large round pale green eyes (light celadon green with a
  hint of gold around the pupil). Long white whiskers, black-tipped near the face, and white eyebrow whiskers.
  Medium-sized, solid, well-fed domestic shorthair build with a round face and fairly large upright black ears;
  long thick black tail. Calm, relaxed, curious expression.

short: >-
  black-and-white tuxedo cat, short glossy black coat, white muzzle with thin white nose blaze, pink nose,
  white bib, white paws, pale green eyes, long white whiskers

keep: [white nose blaze between the eyes, white muzzle with pink nose, white bib, white paws with pink toe beans,
  pale green eyes, solid black head and back, short hair]

negative: >-
  long hair, fluffy fur, tabby stripes, grey cat, orange cat, white face, white blaze covering forehead,
  blue eyes, yellow-orange eyes, black paws, collar text, cartoon, 3d render, extra legs, extra tails,
  distorted face, sunglasses

accessories_seen: [yellow collar (IMG_9277, Mar 2025), heart-shaped pink sunglasses (IMG_0044, a photo prop)]

