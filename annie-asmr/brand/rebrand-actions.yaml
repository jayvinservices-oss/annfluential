    cannot download from it. Instead, on your phone or computer: freesound.org, search ''lip gloss'' / ''lip balm''
    / ''cap click'', filter Licence = Creative Commons 0, download 5 to 10 sounds and upload them to Drive > Annie
    ASMR > sfx. Or record a tube click and wand pull on your phone.'
