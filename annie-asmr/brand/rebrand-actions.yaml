# Rebrand actions shown on the production board. Ann taps Yes / Not now on her phone; answers are saved in
# the board's database (collection "approvals", one doc per id) and Claude reads them back (ArtifactData list).
# who: claude = Claude does it after Ann's yes; ann = only Ann can (Studio, or her own time); access = a setting Ann gives.
# needs_access: true = only after "access-youtube" is done.
- id: approve-style
  who: ann
  title: Approve the style guide and artwork
  detail: Look at the banner, profile picture and thumbnail drafts above. Yes = use them. Not now = tell Claude
    what to change in the note.
- id: access-youtube
  who: access
  title: Give Claude access to the channel
  detail: 'About 20 minutes, best on a computer. 1) console.cloud.google.com: new project "Annie ASMR", enable "YouTube
    Data API v3" and "YouTube Analytics API". 2) OAuth consent screen: External, then "Publish app" so it is In
    production (in Testing the sign-in expires every 7 days). When Google says the app is not verified, click Advanced,
    then continue: it is your own app. 3) Credentials: OAuth client ID, type "Web application", authorised redirect
    URI https://developers.google.com/oauthplayground. 4) developers.google.com/oauthplayground: gear icon, tick
    "Use your own OAuth credentials", paste the client ID and secret there, choose the scopes youtube.force-ssl,
    youtube.upload and yt-analytics.readonly, Authorize (sign in as the Annie ASMR channel), then "Exchange authorization
    code for tokens". 5) In this cloud environment''s settings, add three environment variables: YOUTUBE_CLIENT_ID,
    YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN. Never paste them in chat. Then start a new session; Claude checks
    with "python -m pipeline whoami".'
- id: banner
  who: claude
  needs_access: true
  title: Upload the new banner
  detail: 'Replaces the current banner with the draft above. Reversible: the old one can be put back from Studio.'
- id: about
  who: claude
  needs_access: true
  title: Rewrite the About text and channel keywords
  detail: One-line promise, the four triggers, the AI and voice-clone disclosure, upload rhythm. Claude shows you
    the text first.
- id: playlists
  who: claude
  needs_access: true
  title: Create the six series playlists and sort old videos into them
  detail: Gum Club, Gloss Lab, Nail Studio, Craft Corner, Christmas 2026, Long ASMR for Sleep. Persona or flirty
    videos go in none.
- id: old-thumbnails
  who: claude
  needs_access: true
  title: New-style thumbnails for all old videos
  detail: Drafts are in the brand section above and in Drive > Annie ASMR > brand. One video at a time, the top
    gum video first, click rate checked a week later. Needs your account phone-verified (Studio > Settings > Channel
    > Feature eligibility).
- id: old-titles
  who: claude
  needs_access: true
  title: PG-13 titles and new descriptions for all old videos
  detail: The draft list is in the rebrand plan (Drive > Annie ASMR > brand). Final wording after the analysis.
    Small videos first; the top gum video's title last, only if its click rate holds.
- id: watermark
  who: claude
  needs_access: true
  title: Add a subscribe watermark
  detail: The gold-ring profile picture in the corner of every video; viewers tap it to subscribe.
- id: weekly-report
  who: claude
  needs_access: true
  title: Read the channel numbers every week
  detail: 'Read-only: watch hours, click rate, average view, subscribers, straight onto this board. No more pasting
    Studio summaries.'
- id: seo-every-video
  who: claude
  needs_access: true
  title: Search wording, end screens and cards on every video
  detail: Titles, first description lines, tags and playlists from the channel copy (Drive > brand). End screens
    and cards are set in Studio; Claude gives you the list.
- id: profile-picture
  who: ann
  title: Upload the new profile picture
  detail: 'YouTube Studio > Customization > Branding > Picture. Claude puts the file in Drive: Annie ASMR > brand.
    Apps cannot change it.'
- id: handle
  who: ann
  title: Choose a cleaner handle than @annieasmr9051
  detail: 'Studio > Customization > Basic info > Handle. Try, in order: @annie.asmr, @annieasmrsleep, @glossyannieasmr.
    Your old links keep working for 14 days.'
- id: layout
  who: ann
  title: Set the channel trailer and home-page sections
  detail: 'Studio > Customization > Layout. Trailer: the gum popping video. Sections: Gum Club, Long ASMR for Sleep,
    Christmas 2026. Claude gives you the exact order.'
- id: persona-videos
  who: ann
  title: 'Decide: the pet-name and flirty videos'
  detail: 'Recommended: keep them public with the new PG-13 titles (private videos stop counting toward the 4,000
    hours), but out of playlists and off the home page. Yes = do that. Not now = note what you want instead.'
- id: live-streams
  who: ann
  title: Weekly scheduled live stream (2 hours)
  detail: Archived live streams count toward the 4,000 hours; this is one of the fastest levers. Gum and nails,
    study-with-me style, announced a week ahead. Yes = Claude plans the first one.
- id: friend-gum
  who: ann
  title: A new real gum video with your friend
  detail: The 'with a friend' gum videos are the channel's number one and two. One new 45-minute+ video together
    is the single best bet for hours.
- id: long-videos
  who: claude
  title: Make every new video 45 to 90 minutes
  detail: The 30-minute videos earn almost all the hours; short ones earn almost none. Claude lengthens the plans
    (sleep-friendly, slow endings).
