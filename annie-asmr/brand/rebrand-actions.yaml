# Rebrand actions shown on the production board. Ann taps Yes / Not now on her phone; answers are saved in
# the board's database (collection "approvals", one doc per id) and Claude reads them back (ArtifactData list).
# who: claude = Claude does it after Ann's yes; ann = only Ann can (Studio, or her own time); access = a setting Ann gives.
# needs_access: true = only after "access-youtube" is done.
# group: signin = Ann gives a sign-in or key | approved = Claude does it once signed in | studio = only Ann, in
# YouTube Studio | review = needs Ann's eye again | done = approved, Claude is on it
