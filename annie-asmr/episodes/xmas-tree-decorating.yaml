# Christmas 2 of 4. Make by 24 Nov, publish from 1 Dec.
slug: xmas-tree-decorating
theme: christmas-tree-decorating
title: "ASMR Decorating the Christmas Tree | Gold Glass Bauble Taps, Garland Rustles & Whispers"
description: >-
  Slow, close-up tree decorating: tapping gold and champagne glass baubles with long nails,
  hooking them onto pine branches and draping garland, with a few soft whispers.
made_by: 2026-11-24
publish_after: 2026-12-04
variation:
  ornaments: glass baubles in gold and champagne
