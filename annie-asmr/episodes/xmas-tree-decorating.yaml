objects: [gold glass baubles, champagne baubles, pine branches, garland, ornament box]
sounds: [glass bauble taps, ornament hooks, tinsel rustle, pine needle brushing, box rummaging]
tags: [christmas tree asmr, ornament tapping asmr, glass tapping asmr, christmas asmr]
segments:
