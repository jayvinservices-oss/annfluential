    voice:
      - {at: 20, text: "Gold ones first."}
  - id: garland
    chapter: Garland
    minutes: 9
    shots: [tinsel, hang-ornament]
    sound_bed: [audio/sfx/garland-rustle-01.wav, {file: audio/sfx/pine-brush-01.wav, gain_db: -4}]
  - id: finish
    chapter: Finishing touches
    minutes: 5
    shots: [admire, hang-ornament]
    sound_bed: audio/sfx/glass-bauble-tap-01.wav
    voice:
      - {at: 10, text: "There. It's beautiful. Goodnight."}
