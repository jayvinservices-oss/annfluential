    sound_bed: audio/sfx/gloss-sticky-01.wav
  - id: l3
    chapter: Layers 61 to 100
    minutes: 16
    shots: [apply-wand, press-lips, layer-count]
    sound_bed: [audio/sfx/gloss-apply-01.wav, {file: audio/sfx/gloss-sticky-01.wav, gain_db: -3}]
  - id: shine
